[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
confy = "2.0.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
eyre = "0.6.14"
futures = "0.3.34"
rat-focus = "2.2.1"
rat-widget = "3.3.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
